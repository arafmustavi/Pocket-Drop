<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>{{ app_name }}</title><link rel="stylesheet" href="/static/app.css"></head>
<body><main class="shell"><header><div class="brand">PPV</div><div><h1>Pocket Drop</h1><p>Move originals directly to your laptop.</p></div></header>
<section class="card"><label for="pin">Pairing PIN</label><input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="6-digit PIN" autocomplete="one-time-code">
<div id="drop" class="drop"><input id="picker" type="file" accept="image/*,video/*,.heic,.heif,.dng" multiple><div class="icon">↑</div><strong>Choose photos & videos</strong><span>iPhone and Android supported</span></div>
<div id="summary" class="summary hidden"></div><button id="upload" type="button" disabled>Copy to laptop</button><div id="status" role="status" aria-live="polite"></div><div id="queue" class="queue"></div></section>
<section class="note"><strong>Private by design.</strong> Files travel over your local Wi-Fi and are not sent to a cloud service. Keep this page open during transfer.</section></main><script src="/static/app.js"></script></body></html>
